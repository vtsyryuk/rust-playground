name: Cloud E2E
on:
  deployment_status:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed liquidity-hub demo URL; alternatively configure CLOUD_BASE_URL
        type: string
        default: ''
permissions: {}
jobs:
  cloud-health:
    name: Verify cloud demo responses and processed ticks
    if: (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success') && (github.event_name != 'schedule' || vars.CLOUD_BASE_URL != '')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUD_BASE_URL: ${{ inputs.base_url || vars.CLOUD_BASE_URL || github.event.deployment_status.environment_url }}
      CLOUD_EXPECTED_TICKS: ${{ vars.CLOUD_EXPECTED_TICKS || '100' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify actual deployed application responses
        run: python3 .github/scripts/cloud-e2e.py
