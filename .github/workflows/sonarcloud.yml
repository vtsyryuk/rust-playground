name: SonarCloud Analysis

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'vtsyryuk' }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'vtsyryuk_rust-playground' }}

jobs:
  verify:
    name: SonarCloud build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build, test, and generate LCOV coverage
        run: |
          mkdir -p target/coverage
          cargo llvm-cov --workspace --locked --lcov --output-path target/coverage/lcov.info
      - name: Upload scanner inputs
        uses: actions/upload-artifact@v7
        with:
          name: sonar-inputs
          path: target/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      - name: Report analysis activation state
        shell: bash
        run: |
          if [ "$SONAR_ENABLED" != 'true' ]; then
            echo '### SonarCloud analysis is not activated' >> "$GITHUB_STEP_SUMMARY"
            echo 'Build/test verification ran. No SonarCloud analysis or quality gate ran. Complete .github/SONARCLOUD.md and set SONAR_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
          fi

  analysis:
    name: SonarCloud analysis and quality gate
    needs: verify
    # Untrusted PRs still get build/test verification, without receiving a token.
    if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require analysis credentials
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SonarCloud is enabled but SONAR_TOKEN is missing. Add the repository secret; see .github/SONARCLOUD.md.'
            exit 1
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Download scanner inputs
        uses: actions/download-artifact@v7
        with:
          name: sonar-inputs
          path: target/coverage
      - name: Analyze and enforce the quality gate
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: |
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
